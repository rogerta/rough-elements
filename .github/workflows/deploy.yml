name: Deploy Documentation

on:
  push:
    branches: ["main"]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the
# run in-progress and latest queued.  However, do NOT cancel in-progress runs
# as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build 11ty Site
        run: npm run docs:build

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'dist/docs' # Points to your 11ty output directory

      # deploy-pages looks the artifact up immediately after the upload, but
      # the artifact listing can lag behind the upload (actions/deploy-pages#451),
      # which fails the deploy with "No artifacts named github-pages".  Wait
      # until the artifact is visible before deploying.
      - name: Wait for artifact to be listed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages&per_page=100"
          for i in $(seq 1 40); do
            count=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$url" | jq -r '.total_count // 0')
            echo "attempt $i: found $count 'github-pages' artifact(s)"
            if [ "$count" -ge 1 ]; then
              sleep 5
              exit 0
            fi
            sleep 3
          done
          echo "::error::github-pages artifact not visible after ~2 minutes"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

